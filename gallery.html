<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Content Security Policy. Declared here because GitHub Pages cannot send
     real headers. Placed before the theme script below so that script is
     actually governed by it.

     script-src carries no 'unsafe-inline': the two inline scripts on this
     site are allowed by SHA-256 hash instead. EDITING EITHER ONE CHANGES
     ITS HASH AND THE BROWSER WILL REFUSE TO RUN IT. The hashes cover the
     theme bootstrap below and the JSON-LD block on the home page; regenerate
     them if you touch either. Styles still need 'unsafe-inline' because the
     markup uses style="" attributes throughout.

     Two things this cannot do from a meta tag, by spec: frame-ancestors
     (clickjacking) and HSTS. Both need real response headers, which means
     putting a CDN in front of the site.

     Adding analytics later means adding its origin to script-src and
     connect-src, or it will be blocked silently. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; img-src 'self' data:; font-src https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'sha256-8X3/9Kw8ewCmmsWgc/zNLD+vAtWv1jacv0uvokvWdto=' 'sha256-9KinzBZbqPt7lRM0lAQWFUAf/djlXigKdZwSxhVk2PU='; connect-src 'self' https://api.web3forms.com; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>DJ Mishoo Gallery</title>
<meta name="description" content="Photos from weddings, clubs and private events across Calgary.">
<meta name="theme-color" content="#000000">
<!-- Theme must be set before the stylesheet paints, otherwise a light-mode
     visitor sees a black flash on every navigation. Deliberately inline and
     synchronous: an external or deferred file would run too late. -->
<script>(function(){var d=document.documentElement;try{var t=localStorage.getItem("theme");
if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";}
d.dataset.theme=t;var l=localStorage.getItem("lang")==="ar"?"ar":"en";
d.dataset.lang=l;d.lang=l;d.dir=l==="ar"?"rtl":"ltr";}
catch(e){d.dataset.theme="dark";d.dataset.lang="en";}
/* Turn the scroll-reveal on. Set here, before first paint, so the copy
   never flashes in and then hides. The timer is the safety net: if the
   reveal script has still not marked anything after 3.5s (blocked, slow
   or broken), drop the class and every .reveal falls back to visible. */
d.className+=" js";
setTimeout(function(){if(!document.querySelector(".reveal.in, .tile-in.in")){d.classList.remove("js");}},2200);
})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ?v= is a cache buster. Both GitHub Pages and browsers hold these
     files for a while, so without it a deploy can leave a visitor on
     new HTML with the old CSS or JS, which renders half-styled and
     leaves fresh copy untranslated. Bump this on every deploy: the
     date, plus -2, -3 and so on if you deploy twice in a day. -->
<link rel="stylesheet" href="css/styles.css?v=20260818-5">

<!-- Icons. favicon.ico covers bookmarks and older clients that request it
     by that fixed path; the PNGs cover tabs, Android and the iOS home
     screen. Same red mark at every size. -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
<link rel="manifest" href="/site.webmanifest">

<!-- Canonical plus link-preview cards. Without og:image a link pasted into
     WhatsApp or Instagram shows no picture at all, which is how most
     people arrive here. -->
<link rel="canonical" href="https://djmishoo.ca/gallery.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="DJ Mishoo">
<meta property="og:locale" content="en_CA">
<meta property="og:url" content="https://djmishoo.ca/gallery.html">
<meta property="og:title" content="DJ Mishoo Gallery">
<meta property="og:description" content="Photos from weddings, clubs and private events across Calgary.">
<meta property="og:image" content="https://djmishoo.ca/images/social/og-brand.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="DJ Mishoo, open-format DJ in Calgary">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="DJ Mishoo Gallery">
<meta name="twitter:description" content="Photos from weddings, clubs and private events across Calgary.">
<meta name="twitter:image" content="https://djmishoo.ca/images/social/og-brand.jpg">
</head>

<body data-page="gallery">
<canvas id="gl" aria-hidden="true"></canvas>

<main id="page">

  <section class="page-head">
    <div class="wrap">
      <p class="eyebrow reveal">Gallery</p>
      <h1 class="reveal d1">Nights that <span class="accent">worked</span></h1>
      <p class="crumbs reveal d2"><a href="index.html">Home</a> / Gallery</p>

      <nav class="section-jump reveal d3" aria-label="Gallery sections">
        <a href="#photos">Photos</a>
        <a href="#videos">Videos</a>
      </nav>
    </div>
  </section>

  <!-- ================= PHOTOS ================= -->
  <section style="padding-top:0" id="photos">
    <div class="wrap">
      <div class="sec-head reveal">
        <p class="eyebrow">Photos</p>
        <h2>From the <span class="accent">floor</span></h2>
      </div>
      <!--
        Tiles are generated from CONFIG.gallery in js/app.js. Name photos
        01.jpg, 02.jpg and so on, drop them in images/gallery/, and change
        `count` there to add or remove slots. Clicking a tile opens the
        lightbox below.
      -->
      <div class="gallery" data-gallery></div>
    </div>
  </section>

  <!-- ================= VIDEOS ================= -->
  <section style="padding-top:0" id="videos">
    <div class="wrap">
      <div class="sec-head reveal">
        <p class="eyebrow">Videos</p>
        <h2>Sets in <span class="accent">motion</span></h2>
      </div>
      <!--
        Generated from CONFIG.videos in js/app.js. Name clips 01.mp4,
        02.mp4 and so on, put them in videos/, add matching poster images
        in videos/posters/, then set `count`.
      -->
      <div class="video-grid" data-videos></div>
    </div>
  </section>

  <section style="padding-top:0">
    <div class="wrap center reveal">
      <h2>Want yours in <span class="accent">here?</span></h2>
      <p class="lead" style="margin:1rem auto 2rem">Tell me about the event.</p>
      <a class="btn btn-primary" href="booking.html">Check availability</a>
    </div>
  </section>

</main>

<!-- lightbox, wired up by js/motion.js. Holds either the photo or the
     clip; whichever is not in use is hidden. Video is muted with no
     audio track in the file either. -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Media viewer">
  <button class="lightbox-close" aria-label="Close">
    <svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <img alt="" hidden>
  <video controls muted playsinline preload="none" hidden></video>
</div>

<script src="js/gl.js?v=20260818-5" defer></script>
<script src="js/i18n.js?v=20260818-5" defer></script>
<script src="js/app.js?v=20260818-5" defer></script>
<script src="js/motion.js?v=20260818-5" defer></script>
</body>
</html>
