<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DJ Mishoo Gallery</title>
<meta name="description" content="Photos from weddings, clubs and private events across Calgary.">
<meta name="theme-color" content="#000000">
<!-- Theme must be set before the stylesheet paints, otherwise a light-mode
     visitor sees a black flash on every navigation. Deliberately inline and
     synchronous: an external or deferred file would run too late. -->
<script>(function(){var d=document.documentElement;try{var t=localStorage.getItem("theme");
if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";}
d.dataset.theme=t;var l=localStorage.getItem("lang")==="ar"?"ar":"en";
d.dataset.lang=l;d.lang=l;d.dir=l==="ar"?"rtl":"ltr";}
catch(e){d.dataset.theme="dark";d.dataset.lang="en";}
/* Turn the scroll-reveal on. Set here, before first paint, so the copy
   never flashes in and then hides. The timer is the safety net: if the
   reveal script has still not marked anything after 3.5s (blocked, slow
   or broken), drop the class and every .reveal falls back to visible. */
d.className+=" js";
setTimeout(function(){if(!document.querySelector(".reveal.in, .tile-in.in")){d.classList.remove("js");}},2200);
})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ?v= is a cache buster. Both GitHub Pages and browsers hold these
     files for a while, so without it a deploy can leave a visitor on
     new HTML with the old CSS or JS, which renders half-styled and
     leaves fresh copy untranslated. Bump this on every deploy: the
     date, plus -2, -3 and so on if you deploy twice in a day. -->
<link rel="stylesheet" href="css/styles.css?v=20260811-3">
</head>

<body data-page="gallery">
<canvas id="gl" aria-hidden="true"></canvas>

<main id="page">

  <section class="page-head">
    <div class="wrap">
      <p class="eyebrow reveal">Gallery</p>
      <h1 class="reveal d1">Nights that <span class="accent">worked</span></h1>
      <p class="crumbs reveal d2"><a href="index.html">Home</a> / Gallery</p>

      <nav class="section-jump reveal d3" aria-label="Gallery sections">
        <a href="#photos">Photos</a>
        <a href="#videos">Videos</a>
      </nav>
    </div>
  </section>

  <!-- ================= PHOTOS ================= -->
  <section style="padding-top:0" id="photos">
    <div class="wrap">
      <div class="sec-head reveal">
        <p class="eyebrow">Photos</p>
        <h2>From the <span class="accent">floor</span></h2>
      </div>
      <!--
        Tiles are generated from CONFIG.gallery in js/app.js. Name photos
        01.jpg, 02.jpg and so on, drop them in images/gallery/, and change
        `count` there to add or remove slots. Clicking a tile opens the
        lightbox below.
      -->
      <div class="gallery" data-gallery></div>
    </div>
  </section>

  <!-- ================= VIDEOS ================= -->
  <section style="padding-top:0" id="videos">
    <div class="wrap">
      <div class="sec-head reveal">
        <p class="eyebrow">Videos</p>
        <h2>Sets in <span class="accent">motion</span></h2>
      </div>
      <!--
        Generated from CONFIG.videos in js/app.js. Name clips 01.mp4,
        02.mp4 and so on, put them in videos/, add matching poster images
        in videos/posters/, then set `count`.
      -->
      <div class="video-grid" data-videos></div>
    </div>
  </section>

  <section style="padding-top:0">
    <div class="wrap center reveal">
      <h2>Want yours in <span class="accent">here?</span></h2>
      <p class="lead" style="margin:1rem auto 2rem">Tell me about the event.</p>
      <a class="btn btn-primary" href="booking.html">Check availability</a>
    </div>
  </section>

</main>

<!-- lightbox, wired up by js/motion.js. Holds either the photo or the
     clip; whichever is not in use is hidden. Video is muted with no
     audio track in the file either. -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Media viewer">
  <button class="lightbox-close" aria-label="Close">
    <svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <img alt="" hidden>
  <video controls muted playsinline preload="none" hidden></video>
</div>

<script src="js/gl.js?v=20260811-3" defer></script>
<script src="js/i18n.js?v=20260811-3" defer></script>
<script src="js/app.js?v=20260811-3" defer></script>
<script src="js/motion.js?v=20260811-3" defer></script>
</body>
</html>
